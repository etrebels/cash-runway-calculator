name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write  # gitleaks-action v2 comments on PRs when a leak is found (GITLEAKS_ENABLE_COMMENTS defaults to true)

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
